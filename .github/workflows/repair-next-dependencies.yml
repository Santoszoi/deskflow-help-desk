name: One-time Next.js dependency repair
on:
  push:
    branches: ["security/login-rate-limit-20261008"]
    paths:
      - ".github/workflows/repair-next-dependencies.yml"
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/security/login-rate-limit-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update Next.js and regenerate client lockfile
        run: npm install --prefix client 'next@^16.4.1' --save-exact --no-audit --no-fund
      - name: Verify dependency lockfile
        run: npm ci --prefix client --no-audit --no-fund
      - name: Commit only frontend dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package.json client/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "fix(security): upgrade Next.js to patched release"
          git push origin HEAD:security/login-rate-limit-20261008
